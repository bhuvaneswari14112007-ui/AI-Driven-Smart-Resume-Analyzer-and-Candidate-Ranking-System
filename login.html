<!DOCTYPE html>
<html>

<head>

    <title>Login - Smart Resume Analyzer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Smart Resume Analyzer
        </div>

        <div class="nav-links">

            <a href="index.html">Home</a>
            <a href="login.html">Login</a>

        </div>

    </nav>


    <div class="login-container">

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p>Login to Smart Resume Analyzer</p>


            <form onsubmit="loginUser(event)">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
